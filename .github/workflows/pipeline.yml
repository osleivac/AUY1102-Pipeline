name: CI-CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar dependencias
        run: npm install
      
      - name: Construir imagen Docker
        run: docker build -t app:test .
      
      - name: Ejecutar pruebas dentro del contenedor
        run: docker run app:test npm test

  publish-docker:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Login a Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      
      - name: Construir y publicar imagen
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-ci:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/app-ci:latest

  sonar:
    needs: build-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Análisis con SonarCloud
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    needs: build-test
    runs-on: ubuntu-latest
    continue-on-error: false
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar dependencias
        run: npm install
      
      - name: Análisis de seguridad con Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

  codeql:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      
      - name: Análisis con CodeQL
        uses: github/codeql-action/analyze@v3

  docker-scout:
    needs: publish-docker
    runs-on: ubuntu-latest
    continue-on-error: false
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Login a Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      
      - name: Análisis con Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/app-ci:latest
          exit-code: true
          only-severities: critical,high